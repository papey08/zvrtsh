# Connection header for the upstream: upgrade for WebSockets, keep-alive otherwise
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      '';
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # the API lives on the same origin, so the browser needs no CORS
    location /zvrtsh/api/ {
        proxy_pass http://zvrtsh-app:8080;
        proxy_http_version 1.1;
        # with the port: the backend checks that Origin of a WebSocket matches Host
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        # the backend pings sockets every 25 seconds, so they never look idle
        proxy_read_timeout 60s;
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
