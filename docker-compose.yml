services:
  zvrtsh-front:
    build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      - zvrtsh-app

  zvrtsh-app:
    build: ./backend
    ports:
      - "8080:8080"
    environment:
      USERS_DB_PASSWORD: ${USERS_DB_PASSWORD:?set USERS_DB_PASSWORD in .env}
    depends_on:
      migrate:
        condition: service_completed_successfully

  migrate:
    image: migrate/migrate:v4.18.1
    volumes:
      - ./backend/migrations:/migrations
    command:
      - "-path=/migrations"
      - "-database=postgres://root:${USERS_DB_PASSWORD:?set USERS_DB_PASSWORD in .env}@postgres-users:5432/postgres?sslmode=disable"
      - "up"
    depends_on:
      postgres-users:
        condition: service_healthy

  postgres-users:
    image: postgres:15.3
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: ${USERS_DB_PASSWORD:?set USERS_DB_PASSWORD in .env}
      POSTGRES_DB: postgres
    volumes:
      - db-data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U root -d postgres"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  db-data:
