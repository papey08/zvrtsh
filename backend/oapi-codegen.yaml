# yaml-language-server: $schema=https://raw.githubusercontent.com/oapi-codegen/oapi-codegen/HEAD/configuration-schema.json
package: api
output: internal/ports/httpserver/api/api.gen.go
generate:
  models: true
  gin-server: true
  strict-server: true
output-options:
  # the WebSocket endpoint is served by hand, but its message types are generated
  exclude-operation-ids: [subscribeEvents]
  skip-prune: true
