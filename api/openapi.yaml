openapi: 3.0.3

info:
  title: Zvrtsh API
  version: 1.0.0
  description: |
    HTTP API of the "Zvrtsh" game for 2 to 8 players.

    Every player has a sheet of paper. A player writes a question on a sheet,
    folds it so only the first part ("open question") is visible, and the
    sheet goes to another player, who answers the open part blindly. The game
    goes on for a fixed number of steps, after which all sheets are unfolded.

    A session starts in the lobby: the host creates it with an invite
    (`POST /invites`), the others join by the code (`POST /sessions`), and the
    host starts it (`POST /sessions/{session_id}/start`) whenever they want.

    At every step `i` each player does two things:

    1. writes a question for step `i` on the sheet they hold (`POST .../question`);
    2. answers the open part of the question for step `i` on another sheet
       (`GET .../question-to-answer`, then `POST .../answer`).

    When all players have written the questions of a step, the sheets are
    shuffled at random, and nobody gets their own sheet: with two players it
    means the sheets are swapped. After the answer the sheet stays with the
    player, who writes the question of step `i + 1` on it. The deal is drawn
    when the session starts and stays secret.

servers:
  - url: /zvrtsh/api/v1

tags:
  - name: users
  - name: auth
  - name: invites
  - name: sessions
  - name: events

paths:
  /users:
    post:
      tags: [users]
      operationId: registerUser
      summary: Register a new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Credentials'
      responses:
        '201':
          description: User created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          description: User with this name already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalError'

  /auth/token:
    post:
      tags: [auth]
      operationId: createToken
      summary: Exchange name and password for an access token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Credentials'
      responses:
        '200':
          description: Access token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Token'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  /invites:
    post:
      tags: [invites]
      operationId: createInvite
      summary: Create a session in the lobby with an invite code
      description: |
        Creates a session in the `lobby` status with the caller as its host and
        an invite code, by which up to 7 more players can join it. The caller
        chooses the number of steps. The code is valid for a limited time. A new
        invite cancels the session the caller is still waiting in as the host.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateInviteRequest'
      responses:
        '201':
          description: Invite created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Invite'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags: [invites]
      operationId: deleteInvite
      summary: Cancel the session the caller waits in as the host
      description: |
        Deletes the session in the lobby created by the caller, the joined
        players get `session_deleted`. Does nothing if there is no such session.
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Invite cancelled
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  /sessions:
    get:
      tags: [sessions]
      operationId: listSessions
      summary: List sessions of the caller
      description: Sessions are sorted by the time of the last action, the most recent first.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Sessions of the caller
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Session'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags: [sessions]
      operationId: createSession
      summary: Join a session in the lobby by its invite code
      description: |
        Adds the caller to the players of the session. Joining a session the
        caller already plays in returns it as is.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSessionRequest'
      responses:
        '201':
          description: Session created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Invite code does not exist or has expired
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: The session has already started or has no free places
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalError'

  /events:
    get:
      tags: [events]
      operationId: subscribeEvents
      summary: WebSocket with live updates of the caller's sessions
      description: |
        Upgrades the connection to a WebSocket. Game actions are still made over
        REST; the socket only tells about their results, so clients do not poll.

        1. Within 5 seconds after the connection the client sends
           `EventsAuthMessage` with its token: browsers cannot set the
           `Authorization` header of a WebSocket.
        2. The server answers with `EventsServerMessage` of type `ready`. Every
           change made after it is delivered, so this is the moment to (re)load
           the state over REST.
        3. When a session of the caller is created or changed, the server sends
           `EventsServerMessage` of type `session_updated` with the whole session
           as the caller sees it. Snapshots of a session have a growing `version`,
           an older one than already known can be ignored.
        4. When the host cancels a session in the lobby, the server sends
           `EventsServerMessage` of type `session_deleted` with its `session_id`.

        The client sends nothing after the authentication. The server pings the
        client every 25 seconds. Close codes:

        - `1008` authentication failed;
        - `1013` the client did not keep up with the events, reconnect;
        - `1001` the server is shutting down, reconnect later.
      responses:
        '101':
          description: Switching to the WebSocket protocol
        '426':
          description: The request is not a WebSocket upgrade

  /sessions/{session_id}:
    parameters:
      - $ref: '#/components/parameters/SessionId'
    get:
      tags: [sessions]
      operationId: getSession
      summary: Get session info
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Session info
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/SessionNotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /sessions/{session_id}/start:
    parameters:
      - $ref: '#/components/parameters/SessionId'
    post:
      tags: [sessions]
      operationId: startSession
      summary: Start the session with the players who have joined it
      description: |
        Only the host can start the session, at any moment when at least two
        players are in it. The invite code stops working.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: The started session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: The caller is not the host of this session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          $ref: '#/components/responses/SessionNotFound'
        '409':
          description: The session has already started or has a single player
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalError'

  /sessions/{session_id}/steps/{step_index}/question:
    parameters:
      - $ref: '#/components/parameters/SessionId'
      - $ref: '#/components/parameters/StepIndex'
    post:
      tags: [sessions]
      operationId: makeQuestion
      summary: Write the caller's question for the step on the sheet they hold
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QuestionRequest'
      responses:
        '204':
          description: Question saved
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/SessionNotFound'
        '409':
          $ref: '#/components/responses/StepUnavailable'
        '500':
          $ref: '#/components/responses/InternalError'

  /sessions/{session_id}/steps/{step_index}/question-to-answer:
    parameters:
      - $ref: '#/components/parameters/SessionId'
      - $ref: '#/components/parameters/StepIndex'
    get:
      tags: [sessions]
      operationId: getQuestionToAnswer
      summary: Get the open part of the question the caller has to answer on the step
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Open part of the question
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpenQuestion'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/SessionNotFound'
        '409':
          $ref: '#/components/responses/StepUnavailable'
        '500':
          $ref: '#/components/responses/InternalError'

  /sessions/{session_id}/steps/{step_index}/answer:
    parameters:
      - $ref: '#/components/parameters/SessionId'
      - $ref: '#/components/parameters/StepIndex'
    post:
      tags: [sessions]
      operationId: makeAnswer
      summary: Answer the question for the step on the sheet the caller holds
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AnswerRequest'
      responses:
        '204':
          description: Answer saved
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/SessionNotFound'
        '409':
          $ref: '#/components/responses/StepUnavailable'
        '500':
          $ref: '#/components/responses/InternalError'

  /sessions/{session_id}/finish-vote:
    parameters:
      - $ref: '#/components/parameters/SessionId'
    put:
      tags: [sessions]
      operationId: voteFinish
      summary: Offer or agree to finish the session after the current step
      description: |
        When all players have voted, the session is shortened to the current
        step: the players complete it and the sheets are unfolded. The current
        step is the latest one anybody has written anything on, or the first
        unfinished one if that is later. Nothing written is lost and nobody
        has to start a new question. The votes are reset after that.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: The session after the vote
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/SessionNotFound'
        '409':
          description: The session is not started yet or already finished
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags: [sessions]
      operationId: cancelFinishVote
      summary: Withdraw the offer to finish the session
      security:
        - bearerAuth: []
      responses:
        '200':
          description: The session after the vote is withdrawn
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/SessionNotFound'
        '409':
          description: The session is already finished
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalError'

  /sessions/{session_id}/results:
    parameters:
      - $ref: '#/components/parameters/SessionId'
    get:
      tags: [sessions]
      operationId: getResults
      summary: Get all unfolded sheets of a finished session
      security:
        - bearerAuth: []
      responses:
        '200':
          description: All sheets
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Results'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/SessionNotFound'
        '409':
          description: Session is not finished yet
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalError'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Token received from `POST /auth/token`

  parameters:
    SessionId:
      name: session_id
      in: path
      required: true
      schema:
        type: string
    StepIndex:
      name: step_index
      in: path
      required: true
      description: Zero-based index of the step
      schema:
        type: integer
        minimum: 0

  responses:
    BadRequest:
      description: Malformed request or invalid data
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Missing or invalid credentials or token
      headers:
        WWW-Authenticate:
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: The caller is not a player of this session
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    SessionNotFound:
      description: Session does not exist
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    StepUnavailable:
      description: The step cannot be changed or read right now
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    InternalError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
          example: step is not available right now

    Credentials:
      type: object
      required: [name, password]
      properties:
        name:
          type: string
          minLength: 4
          maxLength: 30
          pattern: '^[A-Za-z0-9_]+$'
        password:
          type: string
          minLength: 4
          maxLength: 30

    User:
      type: object
      required: [name]
      properties:
        name:
          type: string

    Token:
      type: object
      required: [token]
      properties:
        token:
          type: string

    CreateInviteRequest:
      type: object
      required: [steps_amount]
      properties:
        steps_amount:
          type: integer
          minimum: 1
          maximum: 10

    Invite:
      type: object
      required: [invite_code, session_id, steps_amount, expires_at]
      properties:
        invite_code:
          type: string
        session_id:
          type: string
          description: The session in the lobby the code leads to
        steps_amount:
          type: integer
        expires_at:
          type: string
          format: date-time

    CreateSessionRequest:
      type: object
      required: [invite_code]
      properties:
        invite_code:
          type: string

    SessionStatus:
      type: string
      enum: [lobby, in_work, done]

    Session:
      type: object
      required: [id, version, host, players, steps_amount, status, progress, finish_votes, updated_at]
      properties:
        id:
          type: string
        version:
          type: integer
          format: int64
          description: Grows with every change of the session
        host:
          type: string
          description: The player who has created the session, the first of `players`
        players:
          type: array
          description: |
            Names of the players in the order they have joined. The index of a
            player is their sheet and their ink in the interface. `invite` is
            present in the lobby only.
          minItems: 1
          maxItems: 8
          items:
            type: string
        steps_amount:
          type: integer
        status:
          $ref: '#/components/schemas/SessionStatus'
        invite:
          $ref: '#/components/schemas/Invite'
        progress:
          type: array
          description: State of every step from the point of view of the caller, empty in the lobby
          items:
            $ref: '#/components/schemas/StepProgress'
        finish_votes:
          type: array
          description: Players who offer to finish the session after the current step
          items:
            type: string
        updated_at:
          type: string
          format: date-time
          description: Time of the last action in the session

    StepProgress:
      type: object
      required: [my_question, my_answer, answer_sheet_from, answer_sheet_ready, questions_written, answers_written]
      properties:
        my_question:
          type: boolean
          description: |
            The caller has written their question for the step. It is written
            on the sheet the caller has answered the previous step on, so it is
            available as soon as `my_answer` of the previous step.
        my_answer:
          type: boolean
          description: The caller has answered their question of the step
        answer_sheet_ready:
          type: boolean
          description: The questions of the step can be answered, everybody has written theirs and the sheets are shuffled
        answer_sheet_from:
          type: string
          description: Who writes the question the caller has to answer
        questions_written:
          type: integer
          description: How many players have written their question for the step
        answers_written:
          type: integer
          description: How many players have answered on the step

    QuestionRequest:
      type: object
      required: [hidden_question, open_question]
      properties:
        hidden_question:
          type: string
          minLength: 1
          maxLength: 500
          description: Full question, will be folded
        open_question:
          type: string
          minLength: 1
          maxLength: 500
          description: Short visible part of the question

    OpenQuestion:
      type: object
      required: [open_question]
      properties:
        open_question:
          type: string

    AnswerRequest:
      type: object
      required: [answer]
      properties:
        answer:
          type: string
          minLength: 1
          maxLength: 500

    Step:
      type: object
      required: [hidden_question, open_question, answer, asker, answerer]
      properties:
        hidden_question:
          type: string
        open_question:
          type: string
        answer:
          type: string
        asker:
          type: string
          description: Who has written the question
        answerer:
          type: string
          description: Who has answered it

    Sheet:
      type: object
      required: [owner, steps]
      properties:
        owner:
          type: string
          description: The player who has started the sheet with the question of the first step
        steps:
          type: array
          items:
            $ref: '#/components/schemas/Step'

    Results:
      type: object
      required: [id, sheets]
      properties:
        id:
          type: string
        sheets:
          type: array
          description: One sheet per player, in the order of `players`
          minItems: 2
          maxItems: 8
          items:
            $ref: '#/components/schemas/Sheet'

    EventsAuthMessage:
      type: object
      description: The first and the only message from the client to `/events`
      required: [type, token]
      properties:
        type:
          type: string
          enum: [auth]
        token:
          type: string

    EventsServerMessage:
      type: object
      description: A message from the server to `/events`
      required: [type]
      properties:
        type:
          type: string
          enum: [ready, session_updated, session_deleted]
        session:
          $ref: '#/components/schemas/Session'
        session_id:
          type: string
          description: The deleted session, for `session_deleted`
